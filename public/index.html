<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nokia Quote Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  font-family: 'Space Grotesk', sans-serif;
  background: #ffe9c9;
  background-image:
    radial-gradient(circle at 10% 20%, #ff7a00 0 130px, transparent 130px),
    radial-gradient(circle at 90% 10%, #ffffff 0 100px, transparent 100px),
    radial-gradient(circle at 90% 90%, #ff2d55 0 120px, transparent 120px),
    radial-gradient(circle at 10% 90%, #000 0 90px, transparent 90px);
}

.title-font {
  font-family: 'Archivo Black', sans-serif;
}

.neo-card {
  border: 4px solid black;
  box-shadow: 8px 8px 0px black;
  background: white;
}

.neo-btn {
  border: 4px solid black;
  box-shadow: 6px 6px 0px black;
  transition: .2s ease;
}

.neo-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 10px 10px 0px black;
}

input, textarea {
  border: 3px solid black;
  padding: 10px;
  width: 100%;
  outline: none;
  font-family: 'Space Grotesk', sans-serif;
}
</style>
</head>

<body>

<section class="min-h-screen px-6 py-12">

  <div class="max-w-5xl mx-auto">

    <!-- TITLE -->
    <div class="neo-card rounded-[30px] bg-[#ffcf33] p-8 mb-8">
      <h1 class="title-font text-5xl">NOKIA QUOTE GENERATOR</h1>
      <p class="mt-3 font-medium">Neo Brutalism Quote Maker</p>
    </div>

    <!-- INPUT -->
    <div class="neo-card rounded-[30px] p-8 mb-8">
      <h2 class="title-font text-xl mb-5">INPUT DATA</h2>
      <input id="header" placeholder="Nama Header (contoh: mrcl)" class="mb-3"/>
      <textarea id="text" rows="5" placeholder="Isi teks quote..." class="mb-3"></textarea>
      <button onclick="generate()" class="neo-btn w-full mt-5 bg-black text-white py-4 font-bold">
        GENERATE IMAGE
      </button>
    </div>

    <!-- RESULT -->
<div class="neo-card rounded-[30px] p-8 mb-8">
  <h2 class="title-font text-xl mb-5">RESULT</h2>

  <img id="result" class="w-full hidden border-4 border-black"/>

  <!-- DOWNLOAD BUTTON -->
  <a id="downloadBtn"
     class="neo-btn w-full mt-5 bg-black text-white py-4 font-bold text-center block hidden"
     download="nokia-quote.png">
    DOWNLOAD IMAGE
  </a>
</div>

    <!-- FEATURES -->
    <div class="grid md:grid-cols-3 gap-6 mb-10">

      <div class="neo-card p-5 rounded-[20px]">
        <h3 class="title-font text-sm mb-2">PIXEL-FREE DESIGN</h3>
        <p>Clean brutalist UI</p>
      </div>

      <div class="neo-card p-5 rounded-[20px]">
        <h3 class="title-font text-sm mb-2">AUTO WRAP TEXT</h3>
        <p>Text rapi & responsif</p>
      </div>

      <div class="neo-card p-5 rounded-[20px]">
        <h3 class="title-font text-sm mb-2">NOKIA STYLE ENGINE</h3>
        <p>Canvas generator backend</p>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="neo-card p-6 text-center rounded-[20px]">
      <div class="title-font text-sm">Made with ❤️‍🔥 by Marcellino F.A</div>
    </div>

  </div>

</section>

<script>
function getAutoDateTime() {
  const now = new Date();

  // format tanggal: DD/MM/YYYY
  const date = now.toLocaleDateString("id-ID");

  // format jam: HH:MM
  const time = now.toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit"
  });

  return { date, time };
}

async function generate() {
  const header = document.getElementById("header").value;
  const text = document.getElementById("text").value;

  const { date, time } = getAutoDateTime();

  const res = await fetch("/api/generate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      header,
      text,
      sender: header,
      time,
      date
    })
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  // preview
  const img = document.getElementById("result");
  img.src = url;
  img.classList.remove("hidden");

  // download
  const dl = document.getElementById("downloadBtn");
  dl.href = url;
  dl.classList.remove("hidden");
}
</script>

</body>
</html>
